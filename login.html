<body>
    <main>
        <div class="contenier-login">
            <div class="image-login"><img src="/images/login-img.png" alt="login-img"></div>
            <!-- <div class="logo-login">
                    <img src="/images/Logo-login.png" alt="logo">
                </div> -->
            <div class="title-login">
                
                <div class="adress-login">
                    <div class="logo-login">
                    <img src="/images/Logo-login.png" alt="logo">
                </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account to continue your journey</p>
                </div>
                <div class="form-login">
                <form>
                <div class="email-adress">
                    <label for="your-email">Email Address</label><br>
                <input class="inp" type="email" id="your-email" name="your-email" placeholder="Mena@gmail.com">
                </div>
                <div class="password-adress">
                <label for="password">Password</label><br>
                <input class="inp" type="password" id="password" name="password" placeholder="****" >
                <div class="Remember-me">
                    <div class="circl">
                        <input class="radio" type="radio" id="Remember" >
                        <label for="Remember">Remember me</label>
                    </div>
                    <p><a href="forget-pass.html">Forgot password?</a></p>
                </div>
                
                <button class="login-btn"><a href="/home.html">Login</a></button>
                </div>
                </form>
                <div class="or">
                <span>Or continue with</span>
                </div>
                <div class="sochail">
                    <div class="btn-right">
                        <button><img src="/images/goog.png" alt=""><span>Google</span></button>
                    </div>
                    <div class="btn-left">
                        <button><img src="/images/mdi_apple.png" alt=""><span>Apple</span></button>
                    </div>
                </div>
                <div class="have-an">
                    <p>have an account? <span><a href="/signup.html">Create account</a></span></p>
                </div>
                </div>
            </div>
        </div>
    </main>
